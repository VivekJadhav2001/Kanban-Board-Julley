<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="violet" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0A0A0F"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#7C3AED" stroke-opacity="0.35"/>
  <g filter="url(#glow)">
    <rect x="14" y="14" width="15" height="36" rx="5" fill="url(#violet)"/>
    <rect x="33" y="14" width="17" height="15" rx="5" fill="#7C3AED" fill-opacity="0.65"/>
    <rect x="33" y="33" width="17" height="17" rx="5" fill="#FACC15"/>
  </g>
</svg>
